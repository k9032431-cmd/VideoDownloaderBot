# 2 GB-a çenli wideo ugratmak üçin ýerli Telegram Bot API serweri.
# .env içinde TELEGRAM_API_ID we TELEGRAM_API_HASH doldurylan bolsa install.sh muny goşýar.
services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - downloads:/downloads

  bot:
    environment:
      LOCAL_API_URL: http://telegram-bot-api:8081
    depends_on:
      - telegram-bot-api

volumes:
  telegram-bot-api-data:
